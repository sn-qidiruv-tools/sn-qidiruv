<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELECOM — Qurilma qidiruv</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-950: #061a33;
    --navy-900: #0a2540;
    --blue-700: #003b7e;
    --blue-600: #0057b8;
    --orange-500: #ff6a00;
    --orange-400: #ff8a3d;
    --bg: #eef1f6;
    --surface: #ffffff;
    --text: #101828;
    --text-muted: #64748b;
    --border: #e2e6ed;
    --success: #16a34a;
    --danger: #dc2626;
  }
  [data-theme="dark"] {
    --bg: #0d1420;
    --surface: #161f2e;
    --text: #e7ecf3;
    --text-muted: #8a97ab;
    --border: #2a3446;
    --navy-950: #030c1a;
    --navy-900: #0a1930;
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0 0 40px;
    color: var(--text);
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  :focus-visible { outline: 2px solid var(--orange-500); outline-offset: 2px; }

  /* ---------- shared brand header ---------- */
  .brand-header {
    background: radial-gradient(120% 160% at 15% 0%, var(--blue-600) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
    color: white;
    padding: 30px 20px 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .brand-name {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin: 0 0 4px;
    position: relative;
    z-index: 1;
  }
  .brand-name span { color: var(--orange-400); }
  .welcome {
    font-size: 13.5px;
    opacity: 0.75;
    margin: 0 0 16px;
    position: relative;
    z-index: 1;
    font-weight: 500;
  }
  /* signature: fiber signal pulse line */
  .signal-line {
    display: flex;
    justify-content: center;
    gap: 6px;
    position: relative;
    z-index: 1;
  }
  .signal-line span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--orange-500);
    opacity: 0.25;
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  .signal-line span:nth-child(1) { animation-delay: 0s; }
  .signal-line span:nth-child(2) { animation-delay: 0.15s; }
  .signal-line span:nth-child(3) { animation-delay: 0.3s; }
  .signal-line span:nth-child(4) { animation-delay: 0.45s; }
  .signal-line span:nth-child(5) { animation-delay: 0.6s; }
  .signal-line span:nth-child(6) { animation-delay: 0.75s; }
  .signal-line span:nth-child(7) { animation-delay: 0.9s; }
  @keyframes pulseDot {
    0%, 60%, 100% { opacity: 0.2; transform: scale(1); }
    30% { opacity: 1; transform: scale(1.5); background: var(--orange-400); }
  }
  @media (prefers-reduced-motion: reduce) {
    .signal-line span { animation: none; opacity: 0.6; }
  }

  /* ---------- bo'limlar (tab) o'rtasida o'tish animatsiyasi ---------- */
  @keyframes tabPanelIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tab-panel.tab-anim {
    animation: tabPanelIn 0.5s cubic-bezier(.22,.61,.36,1);
  }
  .olt-content-anim {
    animation: tabPanelIn 0.5s cubic-bezier(.22,.61,.36,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .tab-panel.tab-anim, .olt-content-anim { animation: none; }
  }

  .logout-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    z-index: 1;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.2); }

  .version-tag {
    position: absolute;
    top: 4px;
    right: 8px;
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.3px;
    z-index: 1;
  }

  .theme-toggle {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.9);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1;
    font-size: 15px;
    padding: 0;
  }
  .theme-toggle:hover { background: rgba(255,255,255,0.2); }

  .card, .skeleton, .login-card, .recent-chip, .input-wrap input[type="text"], .copy-btn {
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  [data-theme="dark"] .card-sn mark { background: #3a2610; color: var(--orange-400); }
  [data-theme="dark"] .clear-btn { background: #232f42; color: var(--text-muted); }
  [data-theme="dark"] .copy-btn { background: var(--bg); }
  [data-theme="dark"] .copy-btn.copied { background: #0d2b1c; }
  [data-theme="dark"] .login-error { background: #2a1414; border-color: #4a1f1f; }
  [data-theme="dark"] .skel-line { background: linear-gradient(90deg, #202b3d 25%, #26324a 37%, #202b3d 63%); background-size: 400% 100%; }

  /* ---------- login screen ---------- */
  #loginScreen { min-height: 100vh; display: flex; flex-direction: column; }
  .login-body {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 36px 18px;
  }
  .login-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 26px 24px 24px;
    box-shadow: 0 8px 28px rgba(10,37,64,0.10);
    width: 100%;
    max-width: 340px;
    border: 1px solid var(--border);
  }
  .login-icon {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--blue-600), var(--navy-900));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: -46px auto 14px;
    box-shadow: 0 4px 14px rgba(0,87,184,0.35);
  }
  .login-card h2 {
    text-align: center;
    margin: 0 0 3px;
    font-size: 17px;
    font-weight: 600;
  }
  .login-sub {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .field-group { margin-bottom: 13px; }
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 42px; }
  .eye-btn {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.55;
    padding: 0;
  }
  .eye-btn:hover { opacity: 0.9; }
  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .login-card input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .login-card input:focus { border-color: var(--blue-600); }
  .login-card button.primary {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    background: var(--blue-600);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s, transform 0.1s;
  }
  .login-card button.primary:hover { background: var(--blue-700); }
  .login-card button.primary:active { transform: scale(0.98); }
  .login-error {
    color: var(--danger);
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    padding: 8px;
    margin: 0 0 12px;
    display: none;
  }
  .login-error.show { display: block; }

  /* ---------- app ---------- */
  #appContent { display: none; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }
  h1 {
    font-size: 17px;
    font-weight: 600;
    text-align: center;
    margin: 20px 0 16px;
    color: var(--text-muted);
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin: 18px 0 16px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 9px 2px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active { background: var(--blue-600); color: white; }
  .tab-btn:not(.active):hover { background: var(--bg); }

  .refresh-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-left: 4px;
  }
  .refresh-btn:hover { border-color: var(--blue-600); color: var(--blue-600); }
  .refresh-btn.spinning { animation: spin 0.6s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .star-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    color: #cbd2dc;
  }
  [data-theme="dark"] .star-btn { color: #3a4459; }
  .star-btn.active { color: #f5a623; }

  /* stats */
  .stat-summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 18px;
    text-align: center;
    margin-bottom: 14px;
  }
  .stat-summary .big-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--blue-600);
  }
  .stat-summary .big-label { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
  .stat-section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 18px 0 10px;
  }
  .bar-row { margin-bottom: 10px; }
  .bar-row-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .bar-row-name { font-weight: 500; }
  .bar-row-count { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .bar-track {
    height: 7px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue-600), var(--orange-500));
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .show-more-btn {
    display: block;
    width: 100%;
    margin: 10px 0 4px;
    padding: 10px;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    color: var(--blue-600);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .show-more-btn:hover { border-color: var(--blue-600); }

  /* region filter chips (stats & OLT tabs) */
  .region-filter {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .region-chip {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .region-chip.active { background: var(--blue-600); color: white; border-color: var(--blue-600); }
  .region-chip:not(.active):hover { border-color: var(--blue-600); color: var(--blue-600); }

  /* region badge on search result cards */
  .region-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .region-badge.buxoro { background: #e7f0ff; color: var(--blue-600); }
  .region-badge.kogon { background: #fff1e0; color: var(--orange-500); }
  [data-theme="dark"] .region-badge.buxoro { background: #10233f; }
  [data-theme="dark"] .region-badge.kogon { background: #3a2610; }

  /* OLT tab */
  .olt-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: none;
    background: transparent;
    color: var(--blue-600);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 0 12px;
  }
  .olt-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .olt-list-item:hover { border-color: var(--blue-600); }
  .olt-list-name {
    font-weight: 600;
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
  }
  .olt-list-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 3px 9px;
    border-radius: 999px;
    flex-shrink: 0;
    margin-left: 10px;
  }
  .olt-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }
  .olt-title-row h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15.5px;
    margin: 0;
    flex: 1;
    min-width: 0;
    overflow-wrap: break-word;
  }
  .olt-title-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .olt-search-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .olt-search-wrap {
    display: none;
    margin-bottom: 12px;
    flex: 1;
    min-width: 0;
  }
  .olt-search-wrap.open { display: block; }
  .olt-filter-btn {
    position: relative;
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .olt-filter-btn.active { border-color: var(--blue-600); background: rgba(0,102,255,0.12); }
  .olt-filter-dot {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--orange-400);
  }
  .olt-filter-panel {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin: -4px 0 12px;
  }
  .olt-filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1 1 160px;
    min-width: 140px;
  }
  .olt-filter-field label {
    font-size: 12px;
    color: var(--text-muted);
  }
  .olt-filter-field select {
    padding: 8px 10px;
    font-size: 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .olt-filter-clear {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
  }
  .olt-filter-clear:hover { color: var(--text); border-color: var(--text-muted); }
  .olt-search-wrap input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }
  .olt-search-wrap input:focus { border-color: var(--blue-600); }
  .device-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .device-row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    gap: 8px;
  }
  .device-row-left {
    flex: 1 1 auto;
    min-width: 0;
  }
  .device-row-sn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .device-row-port {
    font-size: 12px;
    color: var(--text-muted);
  }
  .device-more-btn {
    border: none;
    background: var(--bg);
    color: var(--blue-600);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .device-row-right {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .device-row-marka-red {
    font-size: 12px;
    font-weight: 600;
    color: #e5484d;
    margin-top: 2px;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .device-detail {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .device-detail.open { display: block; }

  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .input-wrap { position: relative; flex: 1; }
  .input-wrap input[type="text"] {
    width: 100%;
    padding: 12px 38px 12px 14px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 11px;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface);
    transition: border-color 0.15s;
  }
  .input-wrap input[type="text"]:focus { border-color: var(--blue-600); }
  .clear-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border: none;
    background: #e2e6ed;
    color: var(--text-muted);
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .clear-btn.show { display: flex; }
  .search-box button.search-submit {
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    background: var(--orange-500);
    color: white;
    border: none;
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .search-box button.search-submit:hover { background: #e65f00; }
  .search-box button.search-submit:active { transform: scale(0.97); }

  .recent-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
    min-height: 0;
  }
  .recent-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .recent-chip:hover { border-color: var(--blue-600); color: var(--blue-600); }

  .status {
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
  }
  .status-dot.loading { background: var(--orange-500); animation: pulseDot 1.2s ease-in-out infinite; }

  .card {
    background: var(--surface);
    border-radius: 13px;
    padding: 15px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(16,24,40,0.03);
    animation: cardIn 0.25s ease both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .card-sn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    word-break: break-all;
  }
  .card-sn mark {
    background: #fff1e0;
    color: var(--orange-500);
    border-radius: 3px;
    padding: 0 1px;
  }
  .copy-btn {
    flex-shrink: 0;
    margin-left: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--blue-600); color: var(--blue-600); }
  .copy-btn.copied { background: #ecfdf3; border-color: var(--success); color: var(--success); }

  .card-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
    font-size: 13.5px;
  }
  .label { color: var(--text-muted); flex-shrink: 0; }
  .value { font-weight: 500; text-align: right; }

  .empty, .skeleton-wrap {
    text-align: center;
    color: var(--text-muted);
    padding: 10px 0;
    font-size: 14px;
  }
  .empty-icon { font-size: 30px; margin-bottom: 8px; }

  .skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 15px 16px;
    margin-bottom: 10px;
  }
  .skel-line {
    height: 11px;
    border-radius: 5px;
    background: linear-gradient(90deg, #e9edf3 25%, #f4f6f9 37%, #e9edf3 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    margin: 7px 0;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy-900);
    color: white;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- splash / big circular dot loader ---- */
  #splashScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    transition: opacity 0.35s ease;
  }
  #splashScreen.hide {
    opacity: 0;
    pointer-events: none;
  }
  .dot-spinner {
    position: relative;
    width: 64px;
    height: 64px;
    animation: dotSpin 1.1s linear infinite;
  }
  .dot-spinner .dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 9px;
    height: 9px;
    margin: -4.5px;
    border-radius: 50%;
    background: var(--blue-600);
  }
  @keyframes dotSpin { to { transform: rotate(360deg); } }
  .dot-spinner .dot:nth-child(1) { transform: rotate(0deg) translate(28px); opacity: 1; }
  .dot-spinner .dot:nth-child(2) { transform: rotate(30deg) translate(28px); opacity: 0.92; }
  .dot-spinner .dot:nth-child(3) { transform: rotate(60deg) translate(28px); opacity: 0.83; }
  .dot-spinner .dot:nth-child(4) { transform: rotate(90deg) translate(28px); opacity: 0.75; }
  .dot-spinner .dot:nth-child(5) { transform: rotate(120deg) translate(28px); opacity: 0.66; }
  .dot-spinner .dot:nth-child(6) { transform: rotate(150deg) translate(28px); opacity: 0.58; }
  .dot-spinner .dot:nth-child(7) { transform: rotate(180deg) translate(28px); opacity: 0.5; }
  .dot-spinner .dot:nth-child(8) { transform: rotate(210deg) translate(28px); opacity: 0.41; }
  .dot-spinner .dot:nth-child(9) { transform: rotate(240deg) translate(28px); opacity: 0.33; }
  .dot-spinner .dot:nth-child(10) { transform: rotate(270deg) translate(28px); opacity: 0.25; }
  .dot-spinner .dot:nth-child(11) { transform: rotate(300deg) translate(28px); opacity: 0.16; }
  .dot-spinner .dot:nth-child(12) { transform: rotate(330deg) translate(28px); opacity: 0.08; }

  /* ---------- desktop / kengroq ekranlar uchun moslashuv ---------- */
  @media (min-width: 860px) {
    .brand-name { font-size: 26px; }
    .welcome { font-size: 15px; }

    .login-body { padding-top: 56px; }

  @media (min-width: 1300px) {

</style>

<script>
const CSV_URL_1 = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuGGWnEJD1dkxfvchAcMMWDKCskJiGGu46NxPZlaeJ_LNmLB9Y3hkRJ08T3OjqEXnuPiB4OTJ9Qfar/pub?gid=1223268944&single=true&output=csv";
const CSV_URL_2 = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuGGWnEJD1dkxfvchAcMMWDKCskJiGGu46NxPZlaeJ_LNmLB9Y3hkRJ08T3OjqEXnuPiB4OTJ9Qfar/pub?gid=0&single=true&output=csv";

// list1 -> Kogon tumani, list2 -> Buxoro tumani
const REGIONS = { list1: 'Kogon tumani', list2: 'Buxoro tumani' };

let allRows = [];
let dataLoaded = false;

function loadOneSheet(url, regionKey) {
  Papa.parse(url, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const tagged = results.data.map(row => {
        row._HUDUD = REGIONS[regionKey];
        return row;
      });
      allRows = allRows.concat(tagged);
      dataLoaded = true;
      setStatusIdle(allRows.length + " ta qurilma yuklandi");
    },
    error: function() {
      setStatusIdle("Ba'zi ma'lumotlar yuklanmadi");
    }
  });
}

function setStatusIdle(text) {
  document.getElementById('status').innerHTML = '<span class="status-dot"></span> ' + text +
    '<button class="refresh-btn" id="refreshBtn" onclick="refreshData()" aria-label="Yangilash" title="Ma\'lumotlarni yangilash">🔄</button>';
}

function loadData() {
  loadOneSheet(CSV_URL_1, 'list1');
  loadOneSheet(CSV_URL_2, 'list2');
}

function escapeHtml(str) {
  return (str || '-').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Ustun nomini katta-kichik harfga qaramasdan topadi (masalan "bo'sh port", "BO'SH PORT")
function getField(row, name) {
  const target = name.toLowerCase().trim();
  for (const key in row) {
    if (key.toLowerCase().trim() === target) return row[key];
  }
  return '';
}

function highlightMatch(serial, query) {
  const s = serial || '-';
  if (!query) return escapeHtml(s);
  const idx = s.toLowerCase().lastIndexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(s);
  const before = escapeHtml(s.slice(0, idx));
  const match = escapeHtml(s.slice(idx, idx + query.length));
  const after = escapeHtml(s.slice(idx + query.length));
  return before + '<mark>' + match + '</mark>' + after;
}

function showSkeleton() {
  const resultsEl = document.getElementById('results');
  let html = '';
  for (let i = 0; i < 3; i++) {
    html += '<div class="skeleton"><div class="skel-line" style="width:60%"></div><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:50%"></div></div>';
  }
  resultsEl.innerHTML = html;
}

function doSearch() {
  const qInput = document.getElementById('q');
  const q = qInput.value.trim();
  const resultsEl = document.getElementById('results');
  const clearBtn = document.getElementById('clearBtn');
  clearBtn.classList.toggle('show', q.length > 0);
  resultsEl.innerHTML = '';

  if (q.length < 4) {
    setStatusIdle(dataLoaded ? (allRows.length + " ta qurilma yuklandi. Kamida 4 ta belgi kiriting") : "Yuklanmoqda...");
    return;
  }

  if (!dataLoaded) {
    showSkeleton();
    setStatusIdle("Ma'lumotlar hali yuklanmoqda...");
    return;
  }

  const matches = allRows.filter(row => {
    const seria = (row.SERIA || '').toString().toLowerCase();
    return seria.endsWith(q.toLowerCase());
  });

  if (matches.length === 0) {
    setStatusIdle("Natija topilmadi");
    resultsEl.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Bunday seriya raqami topilmadi</div>';
    return;
  }

  setStatusIdle(matches.length + " ta natija topildi");
  saveRecentSearch(q);

  matches.forEach((row, i) => {
    const card = buildCard(row, q);
    card.style.animationDelay = (i * 0.03) + 's';
    resultsEl.appendChild(card);
  });
}

function buildCard(row, query) {
  const card = document.createElement('div');
  card.className = 'card';
  const sn = row.SERIA || '-';
  const isFav = getFavorites().includes(sn);
  const region = row._HUDUD || '';
  const regionClass = region.includes('Buxoro') ? 'buxoro' : (region.includes('Kogon') ? 'kogon' : '');
  card.innerHTML = `
    <div class="card-top">
      <span class="card-sn">${highlightMatch(sn, query || '')}${region ? `<span class="region-badge ${regionClass}">${escapeHtml(region)}</span>` : ''}</span>
      <div style="display:flex;align-items:center;flex-shrink:0;">
        <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${sn.replace(/'/g,"\\'")}', this)" aria-label="Sevimli">${isFav ? '★' : '☆'}</button>
        <button class="copy-btn" onclick="copyToClipboard('${sn.replace(/'/g,"\\'")}', this)">Nusxa</button>
      </div>
    </div>
    <div class="card-row"><span class="label">OLT</span><span class="value">${escapeHtml(row.OLT)}</span></div>
    <div class="card-row"><span class="label">Port</span><span class="value">${escapeHtml(row.PORT)}</span></div>
    <div class="card-row"><span class="label">Bo'sh port</span><span class="value">${escapeHtml(getField(row, "bo'sh port"))}</span></div>
    <div class="card-row"><span class="label">Manzil</span><span class="value">${escapeHtml(row.MANZIL)}</span></div>
    <div class="card-row"><span class="label">Lokatsiya</span><span class="value">${escapeHtml(row.LOKATSIYA)}</span></div>
    <div class="card-row"><span class="label">Markasi</span><span class="value">${escapeHtml(row.MARKASI)}</span></div>
  `;
  return card;
}


function clearSearch() {
  const qInput = document.getElementById('q');
  qInput.value = '';
  document.getElementById('clearBtn').classList.remove('show');
  document.getElementById('results').innerHTML = '';
  setStatusIdle(dataLoaded ? (allRows.length + " ta qurilma yuklandi") : "Yuklanmoqda...");
  qInput.focus();
}

document.getElementById('q').addEventListener('input', function() {
  document.getElementById('clearBtn').classList.toggle('show', this.value.length > 0);
});

document.getElementById('q').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doSearch();
});

// ---- recent searches ----
function getRecent() {
  try { return JSON.parse(sessionStorage.getItem('sn_recent') || '[]'); } catch(e) { return []; }
}
function saveRecentSearch(q) {
  let recent = getRecent().filter(item => item !== q);
  recent.unshift(q);
  recent = recent.slice(0, 5);
  sessionStorage.setItem('sn_recent', JSON.stringify(recent));
  renderRecent();
}
function renderRecent() {
  const wrap = document.getElementById('recentWrap');
  const recent = getRecent();
  if (recent.length === 0) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = recent.map(q => `<button class="recent-chip" onclick="rerunSearch('${q.replace(/'/g,"\\'")}')">${escapeHtml(q)}</button>`).join('');
}
function rerunSearch(q) {
  document.getElementById('q').value = q;
  document.getElementById('clearBtn').classList.add('show');
  doSearch();
}

// ---- copy to clipboard ----
function copyToClipboard(text, btn) {
  const finish = () => {
    const original = btn.textContent;
    btn.textContent = '✓';
    btn.classList.add('copied');
    showToast('Nusxalandi: ' + text);
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(finish);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    finish();
  }
}
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
}

// ---- tabs ----
function switchTab(name) {
  const map = { search: 'panelSearch', stats: 'panelStats', fav: 'panelFav', olt: 'panelOlt' };
  Object.keys(map).forEach(key => {
    const el = document.getElementById(map[key]);
    if (key === name) {
      el.style.display = 'block';
      el.classList.remove('tab-anim');
      void el.offsetWidth; // reflow — animatsiyani qayta ishga tushirish uchun
      el.classList.add('tab-anim');
    } else {
      el.style.display = 'none';
      el.classList.remove('tab-anim');
    }
  });
  document.getElementById('tabBtnSearch').classList.toggle('active', name === 'search');
  document.getElementById('tabBtnStats').classList.toggle('active', name === 'stats');
  document.getElementById('tabBtnFav').classList.toggle('active', name === 'fav');
  document.getElementById('tabBtnOlt').classList.toggle('active', name === 'olt');
  if (name === 'stats') renderStats();
  if (name === 'fav') renderFavorites();
  if (name === 'olt') renderOltList();
}

// ---- refresh ----
function refreshData() {
  allRows = [];
  dataLoaded = false;
  setStatusIdle('Yangilanmoqda...');
  const btn = document.getElementById('refreshBtn'); // setStatusIdle dan KEYIN olinadi — yangi tugma
  btn.classList.add('spinning');
  document.getElementById('results').innerHTML = '';
  loadOneSheet(CSV_URL_1, 'list1');
  loadOneSheet(CSV_URL_2, 'list2');
  setTimeout(() => btn.classList.remove('spinning'), 700);
}

// ---- favorites ----
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('sn_favorites') || '[]'); } catch(e) { return []; }
}
function toggleFavorite(sn, btn) {
  let favs = getFavorites();
  if (favs.includes(sn)) {
    favs = favs.filter(f => f !== sn);
    if (btn) { btn.classList.remove('active'); btn.textContent = '☆'; }
  } else {
    favs.push(sn);
    if (btn) { btn.classList.add('active'); btn.textContent = '★'; }
  }
  localStorage.setItem('sn_favorites', JSON.stringify(favs));
}
function renderFavorites() {
  const el = document.getElementById('favContent');
  const favs = getFavorites();
  if (favs.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">⭐</div>Hali sevimlilar yo\'q.<br>Qidiruv natijalarida ★ tugmasini bosing.</div>';
    return;
  }
  if (!dataLoaded) {
    el.innerHTML = '<div class="empty">Ma\'lumotlar yuklanmoqda...</div>';
    return;
  }
  el.innerHTML = '';
  favs.forEach(sn => {
    const row = allRows.find(r => (r.SERIA || '') === sn);
    if (!row) return;
    el.appendChild(buildCard(row, ''));
  });
  if (el.innerHTML === '') {
    el.innerHTML = '<div class="empty">Saqlangan qurilmalar topilmadi</div>';
  }
}

// ---- statistics ----
let statsOltExpanded = false;
let statsRegion = 'all'; // 'all' | 'Buxoro' | 'Kogon'

function getCounts(field, rows) {
  const source = rows || allRows;
  const counts = {};
  source.forEach(row => {
    const key = (row[field] || 'Noma\'lum').toString().trim() || 'Noma\'lum';
    counts[key] = (counts[key] || 0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}

function rowsForRegion(region) {
  if (region === 'all') return allRows;
  return allRows.filter(row => row._HUDUD === region);
}

function regionFilterHtml(current, onClickFn) {
  const opts = [['all','Barchasi'], ['Buxoro tumani','Buxoro'], ['Kogon tumani','Kogon']];
  return `<div class="region-filter">` + opts.map(([val, label]) =>
    `<button class="region-chip ${current === val ? 'active' : ''}" onclick="${onClickFn}('${val}')">${label}</button>`
  ).join('') + `</div>`;
}

function setStatsRegion(region) {
  statsRegion = region;
  renderStats();
}

function barsHtml(entries, max) {
  return entries.map(([name, count]) => `
    <div class="bar-row">
      <div class="bar-row-top">
        <span class="bar-row-name">${escapeHtml(name)}</span>
        <span class="bar-row-count">${count}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4, (count/max*100))}%"></div></div>
    </div>
  `).join('');
}

function renderStats() {
  const el = document.getElementById('statsContent');
  if (!dataLoaded) {
    el.innerHTML = '<div class="empty">Ma\'lumotlar yuklanmoqda...</div>';
    return;
  }
  const rows = rowsForRegion(statsRegion);
  const total = rows.length;
  const allOlt = getCounts('OLT', rows);
  const topMarka = getCounts('MARKASI', rows).slice(0, 6);
  const maxOlt = allOlt.length ? allOlt[0][1] : 1;
  const maxMarka = topMarka.length ? topMarka[0][1] : 1;
  const OLT_INITIAL = 8;
  const visibleOlt = statsOltExpanded ? allOlt : allOlt.slice(0, OLT_INITIAL);
  const label = statsRegion === 'all' ? 'jami qurilma' : `jami qurilma (${statsRegion})`;

  el.innerHTML = `
    ${regionFilterHtml(statsRegion, 'setStatsRegion')}
    <div class="stat-summary">
      <div class="big-num">${total.toLocaleString()}</div>
      <div class="big-label">${label}</div>
    </div>
    <div class="stat-section-title">OLT bo'yicha taqsimot (${allOlt.length} ta OLT)</div>
    <div id="oltBars">${allOlt.length ? barsHtml(visibleOlt, maxOlt) : '<div class="empty">Ma\'lumot yo\'q</div>'}</div>
    ${allOlt.length > OLT_INITIAL ? `<button class="show-more-btn" onclick="toggleStatsOlt()">${statsOltExpanded ? 'Kamroq ko\'rsatish' : 'Yana ko\'rsatish (' + (allOlt.length - OLT_INITIAL) + ' ta)'}</button>` : ''}
    <div class="stat-section-title">Markasi bo'yicha taqsimot</div>
    ${topMarka.length ? barsHtml(topMarka, maxMarka) : '<div class="empty">Ma\'lumot yo\'q</div>'}
  `;
}

function toggleStatsOlt() {
  statsOltExpanded = !statsOltExpanded;
  renderStats();
}

// ---- OLT tab ----
let oltRegion = 'all'; // 'all' | 'Buxoro' | 'Kogon'

function setOltRegion(region) {
  oltRegion = region;
  renderOltList();
}

function playOltAnim() {
  const el = document.getElementById('oltContent');
  el.classList.remove('olt-content-anim');
  void el.offsetWidth; // reflow — animatsiyani qayta ishga tushirish uchun
  el.classList.add('olt-content-anim');
}

function renderOltList() {
  const el = document.getElementById('oltContent');
  if (!dataLoaded) {
    el.innerHTML = '<div class="empty">Ma\'lumotlar yuklanmoqda...</div>';
    return;
  }
  const rows = rowsForRegion(oltRegion);
  const allOlt = getCounts('OLT', rows);
  if (allOlt.length === 0) {
    el.innerHTML = regionFilterHtml(oltRegion, 'setOltRegion') + '<div class="empty">OLT topilmadi</div>';
    playOltAnim();
    return;
  }
  el.innerHTML = regionFilterHtml(oltRegion, 'setOltRegion') + '<div class="olt-list-grid">' + allOlt.map(([name, count]) => `
    <div class="olt-list-item" onclick="openOltDevices('${name.replace(/'/g,"\\'")}')">
      <span class="olt-list-name">${escapeHtml(name)}</span>
      <span class="olt-list-count">${count} ta</span>
    </div>
  `).join('') + '</div>';
  playOltAnim();
}

let currentOltName = '';
let currentOltDevices = [];

function openOltDevices(oltName) {
  currentOltName = oltName;
  const rows = rowsForRegion(oltRegion);
  currentOltDevices = rows.filter(r => ((r.OLT || 'Noma\'lum').toString().trim() || 'Noma\'lum') === oltName);

  const el = document.getElementById('oltContent');
  el.innerHTML = `
    <button class="olt-back-btn" onclick="renderOltList()">← Barcha OLT lar</button>
    <div class="olt-title-row">
      <h3 class="mono">${escapeHtml(oltName)}</h3>
      <div class="olt-title-right">
        <span class="olt-list-count" id="oltDeviceCount">${currentOltDevices.length} ta qurilma</span>
      </div>
    </div>
    <div class="olt-search-row">
      <div class="olt-search-wrap open" id="oltSearchWrap">
        <input type="text" id="oltSearchInput" placeholder="Port bo'yicha qidirish..." oninput="applyOltFilters()">
      </div>
      <button class="olt-filter-btn" id="oltFilterBtn" onclick="toggleOltFilterPanel()" aria-label="Filtr">⚙️<span class="olt-filter-dot" id="oltFilterDot" style="display:none;"></span></button>
    </div>
    <div class="olt-filter-panel" id="oltFilterPanel" style="display:none;">
      <div class="olt-filter-field">
        <label>Qurilma markasi</label>
        <select id="oltFilterMarka" onchange="applyOltFilters()">
          <option value="">Barchasi</option>
        </select>
      </div>
      <div class="olt-filter-field">
        <label>Bo'sh port</label>
        <select id="oltFilterBoshPort" onchange="applyOltFilters()">
          <option value="">Barchasi</option>
          <option value="bor">Bo'sh port bor (&gt;0)</option>
          <option value="yoq">Bo'sh port yo'q (0)</option>
        </select>
      </div>
      <button class="olt-filter-clear" onclick="clearOltFilters()">Tozalash</button>
    </div>
    <div id="oltDeviceRows"></div>
  `;
  populateOltFilterOptions();
  renderDeviceRows(currentOltDevices);
  playOltAnim();
}

function renderDeviceRows(devices) {
  const rowsEl = document.getElementById('oltDeviceRows');
  if (devices.length === 0) {
    rowsEl.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Hech narsa topilmadi</div>';
    return;
  }
  rowsEl.innerHTML = devices.map((row, i) => {
    const sn = row.SERIA || '-';
    const rid = 'dv' + i;
    const isFav = getFavorites().includes(sn);
    return `
      <div class="device-row">
        <div class="device-row-top" onclick="toggleDeviceDetail('${rid}')">
          <div class="device-row-left">
            <div class="device-row-sn">Port: ${escapeHtml(row.PORT)}</div>
            <div class="device-row-marka-red">${escapeHtml(row.MARKASI)}</div>
          </div>
          <div class="device-row-right">
            <button class="star-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${sn.replace(/'/g,"\\'")}', this)" aria-label="Sevimli">${isFav ? '★' : '☆'}</button>
            <button class="device-more-btn" id="btn-${rid}">Ko'proq</button>
          </div>
        </div>
        <div class="device-detail" id="${rid}">
          <div class="card-row"><span class="label">Seriya</span><span class="value">${escapeHtml(sn)}</span></div>
          <div class="card-row"><span class="label">Bo'sh port</span><span class="value">${escapeHtml(getField(row, "bo'sh port"))}</span></div>
          <div class="card-row"><span class="label">Manzil</span><span class="value">${escapeHtml(row.MANZIL)}</span></div>
          <div class="card-row"><span class="label">Lokatsiya</span><span class="value">${escapeHtml(row.LOKATSIYA)}</span></div>
        </div>
      </div>
    `;
  }).join('');
}

function populateOltFilterOptions() {
  const sel = document.getElementById('oltFilterMarka');
  const markas = Array.from(new Set(currentOltDevices.map(r => (r.MARKASI || '').toString().trim()).filter(Boolean))).sort();
  sel.innerHTML = '<option value="">Barchasi</option>' + markas.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
}

function toggleOltFilterPanel() {
  const panel = document.getElementById('oltFilterPanel');
  panel.style.display = (panel.style.display === 'none') ? 'flex' : 'none';
}

function clearOltFilters() {
  document.getElementById('oltSearchInput').value = '';
  document.getElementById('oltFilterMarka').value = '';
  document.getElementById('oltFilterBoshPort').value = '';
  applyOltFilters();
}

function applyOltFilters() {
  const q = (document.getElementById('oltSearchInput').value || '').trim().toLowerCase();
  const marka = document.getElementById('oltFilterMarka').value;
  const boshPort = document.getElementById('oltFilterBoshPort').value;
  const countEl = document.getElementById('oltDeviceCount');
  const dot = document.getElementById('oltFilterDot');
  const filterBtn = document.getElementById('oltFilterBtn');

  const hasFilters = !!(marka || boshPort);
  dot.style.display = hasFilters ? 'block' : 'none';
  filterBtn.classList.toggle('active', hasFilters);

  let filtered = currentOltDevices;
  if (q) {
    filtered = filtered.filter(row => (row.PORT || '').toString().toLowerCase().includes(q));
  }
  if (marka) {
    filtered = filtered.filter(row => (row.MARKASI || '').toString().trim() === marka);
  }
  if (boshPort) {
    filtered = filtered.filter(row => {
      const val = parseFloat(getField(row, "bo'sh port"));
      const n = isNaN(val) ? 0 : val;
      return boshPort === 'bor' ? n > 0 : n <= 0;
    });
  }

  renderDeviceRows(filtered);
  countEl.textContent = (q || hasFilters) ? filtered.length + ' ta natija' : filtered.length + ' ta qurilma';
}

function toggleDeviceDetail(id) {
  const detail = document.getElementById(id);
  const btn = document.getElementById('btn-' + id);
  const isOpen = detail.classList.toggle('open');
  btn.textContent = isOpen ? 'Yopish' : "Ko'proq";
}

// ---- theme ----
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  const icon = theme === 'dark' ? '☀️' : '🌙';
  const btn1 = document.getElementById('themeToggleLogin');
  const btn2 = document.getElementById('themeToggleApp');
  if (btn1) btn1.textContent = icon;
  if (btn2) btn2.textContent = icon;
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('sn_theme', next);
  applyTheme(next);
}
(function initTheme() {
  const saved = localStorage.getItem('sn_theme');
  if (saved) {
    applyTheme(saved);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    applyTheme('dark');
  }
})();

// ---- login ----
function togglePassVisibility() {
  const input = document.getElementById('loginPass');
  const btn = document.getElementById('eyeBtn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

const LOGIN_USER = "uztel";
const LOGIN_PASS = "admin1";

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  renderRecent();
  loadData();
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');

  if (u === LOGIN_USER && p === LOGIN_PASS) {
    sessionStorage.setItem('sn_auth', '1');
    errEl.classList.remove('show');
    showApp();
  } else {
    errEl.classList.add('show');
  }
}

function doLogout() {
  sessionStorage.removeItem('sn_auth');
  document.getElementById('appContent').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginUser').focus();
}

document.getElementById('loginPass').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});

if (sessionStorage.getItem('sn_auth') === '1') {
  showApp();
}

setTimeout(function() {
  const splash = document.getElementById('splashScreen');
  splash.classList.add('hide');
  setTimeout(() => splash.remove(), 400);
}, 700);

</script>
